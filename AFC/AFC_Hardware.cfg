[include mcu/TN2.cfg]

# [AFC_buffer AFC_Pro]
# type: FPS_PSF
# adc_pin: TN2:PA0 #I don't remember which pin this is
# neutral_point: 0.5
# max_tension: 0.1
# max_compression: 0.9
# reversed: true  #Test slide by hand and look at buffer state in mainsail/fluidd Set to true if display shows opposite of your tested state.
# led_index: Buffer_Indicator:1

[AFC_buffer AFC_Pro]
type: FPS_PSF
adc_pin: TN2:PA4
neutral_point: 0.5
max_tension: 0.1
max_compression: 0.9
reversed: true  #Test slide by hand and look at buffer state in mainsail/fluidd Set to true if display shows opposite of your tested state.
adc_min_val: 0.001
adc_max_val: 0.885

[AFC_led Buffer_Indicator]
pin: TN2:PB1
chain_count: 1
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
